# Signs in as the seeded owner and reaches the manifest board
appId: com.dangertechnologies.openmanifest
name: login
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'LOG IN'
    timeout: 60000
- tapOn: 'Email'
- inputText: 'owner@example.com'
- tapOn: 'Password'
- inputText: 'Password1!'
- hideKeyboard
- tapOn: 'LOG IN'
# The seeded owner has one operator to pick
- extendedWaitUntil:
    visible: 'Dropzone'
    timeout: 60000
- takeScreenshot: operators
- tapOn: 'Dropzone'
- extendedWaitUntil:
    visible:
      id: 'loads'
    timeout: 60000
- takeScreenshot: board
